[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chile-mutual-funds-analytics"
version = "0.1.0"
description = "What Chilean mutual funds hold, month by month, from the CMF portfolio files"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
dependencies = ["pandas>=2.1", "numpy>=1.26", "matplotlib>=3.8", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ffmm = "ffmm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ffmm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
